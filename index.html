    <script>
      /* Ensure window.fetch has both getter and setter to prevent "Cannot set property fetch of #<Window> which has only a getter" */
      (function () {
        try {
          var nativeFetch = window.fetch;
          var activeFetch = typeof nativeFetch === 'function' ? nativeFetch.bind(window) : nativeFetch;

          Object.defineProperty(window, 'fetch', {
            get: function () {
              return activeFetch;
            },
            set: function (newFetch) {
              activeFetch = typeof newFetch === 'function' ? newFetch : nativeFetch;
            },
            configurable: true,
            enumerable: true,
          });

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', {
                get: function () {
                  return activeFetch;
                },
                set: function (newFetch) {
                  activeFetch = typeof newFetch === 'function' ? newFetch : nativeFetch;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e) {}
          }
        } catch (err) {
          // Graceful fallback
        }

        window.addEventListener('error', function (event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch of') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        });
      })();
    </script>
